<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crop Yield Prediction</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-center text-green-600 mb-6">🌱 Crop Yield Prediction</h1>

    <form id="predictForm" class="space-y-4">
      <input type="text" name="state_name" placeholder="State Name" required class="w-full px-4 py-2 border rounded-lg">
      <input type="text" name="district_name" placeholder="District Name" required class="w-full px-4 py-2 border rounded-lg">
      <input type="number" name="year" placeholder="Year (e.g., 2025)" required class="w-full px-4 py-2 border rounded-lg">
      <select name="season" required class="w-full px-4 py-2 border rounded-lg">
        <option value="">-- Select Season --</option>
        <option value="kharif">Kharif</option>
        <option value="rabi">Rabi</option>
        <option value="zaid">Zaid</option>
      </select>
      <input type="text" name="crop" placeholder="Crop Name" required class="w-full px-4 py-2 border rounded-lg">

      <button type="submit" class="w-full bg-green-500 text-white py-2 rounded-lg hover:bg-green-600">Predict</button>
    </form>

    <div id="result" class="mt-6 text-center text-gray-700 hidden"></div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
